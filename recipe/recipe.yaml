context:
  version: "0.11.4"

package:
  name: rsop
  version: ${{ version }}

source:
  url: https://codeberg.org/heiko/rsop/archive/rsop/v${{ version }}.tar.gz
  sha256: a302200785ed4dbc07c1883d91d58ffd26c8f3fb8c167f5009e1a40887b1298d

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # fix osx-arm64 compilation by prefetching and patching the `sha1-asm` crate (removing invalid relocation specifiers)
      - if: target_platform == "osx-arm64"
        then: |
          ^cargo fetch --locked
          
          $env.CARGO_HOME? | default ($env.HOME | path join .cargo) | path join '**/aarch64_apple.S' | glob $in | each {|file|
            cp $file $'($file).bak'
            open $file | str replace --all '#:lo12:' '' | save --force $file
          }          
      # build main app and generate license data
      - cd rsop
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins --features=cliv
      - cargo-bundle-licenses --format=yaml --output=../THIRDPARTY.yml
      # copy shell completion files and man page
      - mkdir ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions ($prefix)/share/man/man1
      - let out_dir = glob ../target/*/release/build/rsop-*/out | first
      - cp ($out_dir)/rsop.bash ($prefix)/share/bash-completion/completions/rsop
      - cp ($out_dir)/rsop.fish ($prefix)/share/fish/vendor_completions.d/rsop.fish
      - cp ($out_dir)/_rsop     ($prefix)/share/zsh/site-functions/_rsop
      - cp ($out_dir)/*.1       ($prefix)/share/man/man1/

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - nushell

tests:
  - script:
      - rsop --help
      - rsop version
      - rsopv --help
      - rsopv version
  - package_contents:
      bin:
        - rsop
        - rsopv
      files:
        - if: unix
          then:
            - share/bash-completion/completions/rsop
            - share/fish/vendor_completions.d/rsop.fish
            - share/zsh/site-functions/_rsop
            - share/man/man1/rsop*.1
        - if: win
          then:
            - Library/share/bash-completion/completions/rsop
            - Library/share/fish/vendor_completions.d/rsop.fish
            - Library/share/zsh/site-functions/_rsop
            - Library/share/man/man1/rsop*.1
      strict: true

about:
  summary: Stateless OpenPGP (SOP) CLI tool
  description: |
    rsop is a "Stateless OpenPGP" (SOP) CLI tool. It exposes a simple,
    standardized CLI interface to perform a set of common OpenPGP operations.
  license: CC0-1.0
  license_file:
    - LICENSES/CC0-1.0.txt
    - THIRDPARTY.yml
  homepage: https://codeberg.org/heiko/rsop
  repository: https://codeberg.org/heiko/rsop

extra:
  recipe-maintainers:
    - salim-b
